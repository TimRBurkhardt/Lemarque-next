<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" preserveAspectRatio="none">
  <defs>
    <radialGradient id="mist">
      <stop stop-color="white" stop-opacity=".98"/>
      <stop offset=".42" stop-color="white" stop-opacity=".85"/>
      <stop offset=".7" stop-color="white" stop-opacity=".64"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <filter id="cloud" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".005 .008" numOctaves="3" seed="17" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="310" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  <g fill="url(#mist)" filter="url(#cloud)">
    <ellipse cx="-85" cy="130" rx="460" ry="310"/>
    <ellipse cx="-90" cy="630" rx="410" ry="420"/>
    <ellipse cx="180" cy="-55" rx="470" ry="300"/>
    <ellipse cx="1050" cy="-55" rx="600" ry="290"/>
    <ellipse cx="1640" cy="170" rx="480" ry="380"/>
    <ellipse cx="1630" cy="680" rx="500" ry="420"/>
    <ellipse cx="210" cy="1080" rx="510" ry="230"/>
    <ellipse cx="1090" cy="1110" rx="620" ry="290"/>
  </g>
</svg>
